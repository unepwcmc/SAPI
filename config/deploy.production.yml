# Name of the container image
image: unepwcmc/sapi/rails-production

servers:
  web:
    hosts:
      - sapi-web-prod-01.linode.unep-wcmc.org
    options:
      add-host: host.docker.internal:host-gateway # Required to reach host-bound Redis
    proxy:
      response_timeout: 120 # kamal-proxy timeout config, default 30, cloudflare max 120.
      hosts:
        - sapi-web-prod-01.linode.unep-wcmc.org
        - www.speciesplus.net
        - preflight.speciesplus.net
        # The public domain is listed BEFORE the DNS flip on purpose: kamal-proxy
        # only requests a Let's Encrypt certificate for a host once it is routed
        # here, and issuance needs the DNS record already pointing at this box.
        # Adding it now means the cert is obtained on the first request after the
        # flip, instead of the flip landing on a host with no route for that name.
        # Records must be DNS-only (grey cloud) — Cloudflare terminates HTTP-01.
        # The .linode host stays for internal checks; drop it once the public
        # domain is proven.
      ssl: true
      logging:
        request_headers:
          - Cache-Control
          - User-Agent
          - X-Forwarded-Proto
        response_headers:
          - X-Request-ID
  job:
    hosts:
      - sapi-web-prod-01.linode.unep-wcmc.org
    env:
      clear:
        # Sidekiq has ten job threads, so its database pool must override the
        # five-connection web default. Remove this if Sidekiq returns to five.
        SAPI_RAILS_MAX_THREADS: 10
    options:
      add-host: host.docker.internal:host-gateway # Required to reach host-bound Redis
      # Docker-native healthcheck (non-proxy role). Explicit fast interval/start-period
      # so the container reports healthy well within Kamal's readiness window — Docker's
      # default 30s interval means the first check wouldn't fire in time otherwise.
      # https://docs.docker.com/engine/containers/run/#healthchecks
      health-cmd: /rails/bin/docker-sidekiq-healthcheck
      health-interval: 5s
      health-retries: 3
      health-start-period: 5s
      health-timeout: 3s
    cmd: bundle exec sidekiq -C config/sidekiq.yml

# Build remotely on the production web server (not the staging server the base
# config points at), using the production-specific Docker target that starts puma.
builder:
  dockerfile: Dockerfile
  target: exec-production
  remote: ssh://wcmc@sapi-web-prod-01.linode.unep-wcmc.org

# Environment variables
env:
  clear:
    RAILS_ENV: production
    # Six workers give the checklist's bursty API traffic most of the shared
    # VM's capacity while leaving room for the other apps and Sidekiq. Revisit
    # after production load testing or when adding another host.
    WEB_CONCURRENCY: 6
    RAILS_MAX_THREADS: 5 # Puma threads per worker; database pools are configured separately below.
    # Keep each web database pool aligned with Puma's five request threads.
    # The job role overrides this because Sidekiq has different concurrency.
    SAPI_RAILS_MAX_THREADS: 5

# kamal-proxy daemon settings (top level = the shared proxy container itself,
# distinct from the per-role `proxy:` blocks above which configure routing).
#
# metrics_port makes kamal-proxy publish Prometheus metrics — per-host request
# counts, status classes and request durations — which Zabbix scrapes to graph
# real per-site traffic. Without it the daemon runs with metrics disabled
# (kamal-proxy's default is 0 = off) and there is nothing to pull.
#
# This is set in EVERY app because whichever app boots or reboots the shared
# proxy determines the daemon's flags; if one repo lacked it, a reboot triggered
# from that repo would silently drop metrics.
proxy:
  run:
    metrics_port: 9091
